! NetAudit AI Test Dataset - Cisco IOS Configuration 01
! Purpose: Benchmark configuration containing deterministic security misconfigurations
! Vendor: Cisco IOS / IOS-XE
version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Core-Edge-Router-01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$lC99A.1pQJ8g4B31bN5e//
!
no aaa new-model
!
ip domain name corporate.local
ip name-server 8.8.8.8
ip http server
no ip http secure-server
!
interface GigabitEthernet0/0
 description WAN Internet Interface
 ip address 203.0.113.1 255.255.255.248
 ip access-group OUTSIDE_IN in
 ip access-group OUTSIDE_OUT out
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description Internal Management LAN
 ip address 192.168.1.1 255.255.255.0
 ip access-group ADMIN_ONLY in
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description DMZ Web Server Segment
 ip address 10.0.10.1 255.255.255.0
 duplex auto
 speed auto
!
! Critical Misconfigurations in Access Control Lists
!
ip access-list extended OUTSIDE_IN
 remark Allow web traffic to DMZ
 permit tcp any host 10.0.10.80 eq www log
 permit tcp any host 10.0.10.443 eq 443 log
 remark DANGEROUS: Unrestricted SSH to internal management network without logging
 permit tcp any host 192.168.1.5 eq 22
 remark DANGEROUS: Excessively broad source and destination allow all
 permit ip any any
!
ip access-list extended ADMIN_ONLY
 permit ip 192.168.1.0 0.0.0.255 any log
 deny ip any any log
!
ip access-list extended OUTSIDE_OUT
 permit ip 192.168.1.0 0.0.0.255 any
 permit ip 10.0.10.0 0.0.0.255 any
!
snmp-server community public RO
snmp-server community private RW
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 password cisco
 login
 transport input telnet ssh
line vty 5 15
 password cisco
 login
 transport input telnet
!
end

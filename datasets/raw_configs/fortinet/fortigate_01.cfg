# NetAudit AI Test Dataset - Fortinet FortiOS Configuration 01
# Purpose: Benchmark Fortinet configuration containing deterministic security misconfigurations
# Vendor: Fortinet FortiOS
config system global
    set hostname "FW-FG100E-Edge"
    set admin-sport 80
    set admin-ssh-port 22
    set admin-telnet-port 23
    set admintimeout 60
end

config system admin
    edit "admin"
        set trusthost1 0.0.0.0 0.0.0.0
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2x391...
    next
end

config firewall policy
    edit 1
        set name "Permit-DMZ-Web"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "10.0.10.80"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set logtraffic all
    next
    edit 2
        set name "DANGEROUS-Unrestricted-SSH"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "192.168.1.5"
        set action accept
        set schedule "always"
        set service "SSH"
        set logtraffic disable
    next
    edit 3
        set name "DANGEROUS-Excessive-Any-Allow"
        set srcintf "port1"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
end
